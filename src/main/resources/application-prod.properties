# Perfil prod: PostgreSQL. En Render (o Railway) cada valor llega como variable de entorno del panel;
# la contrasena no tiene un valor por defecto utilizable
# DATASOURCE_URL completa tiene prioridad; si no llega, la URL se arma con host, puerto y base por
# separado, que es como los entrega el Blueprint de Render (render.yaml)
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5432}/${DATASOURCE_DB:appdb}}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# validate no crea tablas: con una base nueva la aplicacion no arrancaria. El esquema lo crea este
# script idempotente (CREATE TABLE IF NOT EXISTS) antes de que Hibernate lo valide
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-postgresql.sql

logging.level.root=WARN
logging.level.com.tienda.pedidos=INFO

# Actuator en prod: solo health e info. beans, env, configprops... responden 404, porque mostrarian
# variables de entorno y la configuracion interna a cualquiera
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
