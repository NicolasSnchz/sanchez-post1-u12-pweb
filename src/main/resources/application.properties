spring.application.name=pedidos

# H2 en memoria: la base se crea al arrancar a partir de la entidad Pedido
spring.datasource.url=jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# springdoc-openapi: JSON de OpenAPI en /api-docs y Swagger UI en /swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Solo las respuestas declaradas con @ApiResponse en cada endpoint (sin agregar a todos los del
# @RestControllerAdvice, que haria aparecer un 404 en el POST)
springdoc.override-with-generic-response=false
