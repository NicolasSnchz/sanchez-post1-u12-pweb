# Configuracion comun a los dos perfiles. Los valores sensibles viven en application-dev.properties y
# application-prod.properties, siempre como ${VARIABLE:valor-por-defecto}
spring.application.name=pedidos
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false

# springdoc-openapi: JSON de OpenAPI en /api-docs y Swagger UI en /swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.override-with-generic-response=false

# /actuator/info (expuesto en los dos perfiles): nombre y version del artefacto
management.info.env.enabled=true
info.app.nombre=@project.name@
info.app.version=@project.version@
