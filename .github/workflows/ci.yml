# Pipeline de integracion continua: en cada push o pull request a main
#   1. build-and-test: compila y corre todas las pruebas (unitarias, web e integracion)
#   2. docker-build:   solo si el job anterior paso. Construye la imagen con el mismo Dockerfile de la
#                      Parte 1, la levanta en el runner y comprueba que /actuator/health responde UP.
#                      No publica la imagen en ningun registro (ver README, decisiones de la Parte 2)
name: CI - Build, Test & Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # permite volver a correrlo a mano desde la pestana Actions

jobs:
  # -- Job 1: compilar y ejecutar las pruebas ------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Configurar JDK 21 con cache de Maven
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven            # reutiliza ~/.m2 entre ejecuciones

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B -ntp clean verify | tee maven.log

      - name: Resumen de las pruebas en la pagina de la ejecucion
        if: always()
        run: |
          {
            echo "### Pruebas (build-and-test)"
            echo '```'
            grep -E 'Tests run:|BUILD' maven.log || echo "Maven no llego a ejecutar las pruebas"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas como artefacto
        uses: actions/upload-artifact@v6
        if: always()              # tambien cuando una prueba falla: ahi es cuando mas se necesita
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # -- Job 2: construir la imagen y verificar el monitoreo -----------------------------------------
  docker-build:
    runs-on: ubuntu-24.04
    needs: build-and-test         # no se construye una imagen de un codigo con pruebas en rojo
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Construir la imagen Docker
        run: |
          docker build -t mi-spring-app:${{ github.sha }} .
          docker images mi-spring-app

      - name: Levantar el contenedor y esperar /actuator/health
        run: |
          # Sin variables de entorno: arranca con el perfil dev y H2, como en la maquina local
          docker run -d --name smoke-test -p 8080:8080 mi-spring-app:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "La aplicacion respondio UP (intento ${i}/30):"
              curl -s http://localhost:8080/actuator/health; echo
              # El mismo resultado en el resumen de la ejecucion, visible en GitHub sin abrir los logs
              {
                echo "### Smoke test de la imagen mi-spring-app:${GITHUB_SHA::7}"
                echo "Imagen: $(docker image inspect mi-spring-app:${{ github.sha }} --format '{{.Size}}' | awk '{printf "%d MB", $1/1048576}'), usuario \`$(docker image inspect mi-spring-app:${{ github.sha }} --format '{{.Config.User}}')\`"
                echo ""
                echo "\`GET /actuator/health\` respondio **UP** en el intento ${i} de 30:"
                echo '```json'
                curl -s http://localhost:8080/actuator/health; echo
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Esperando a que la aplicacion arranque... (${i}/30)"
            sleep 2
          done

          echo "La aplicacion no respondio UP a tiempo"
          docker logs smoke-test
          echo "### Smoke test FALLIDO: /actuator/health no respondio UP en 60 s" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Detener el contenedor de prueba
        if: always()              # se limpia aunque el smoke test falle
        run: docker rm -f smoke-test || true
